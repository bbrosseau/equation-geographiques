name: Release

# Publier une release sur GitHub (avec un nouveau tag, ex. v1.0.1) compile l'application
# et y joint les installateurs. « Run workflow » dans l'onglet Actions fait une compilation
# de test : les fichiers sont alors téléchargeables dans la page de l'exécution.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          # Ubuntu 22.04 : glibc assez ancienne pour le Linux de ChromeOS (Debian 12).
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION:-0.0.0}" >> "$GITHUB_ENV"

      - name: Bibliothèques Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Dépendances
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: |
          uv sync --locked --no-dev --python 3.12
          uv pip install "pyinstaller>=6.11" pillow

      - name: PyInstaller
        run: uv run --no-sync pyinstaller --clean --noconfirm equation_geographique.spec

      - name: Vérifier que l'application se lance
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            dist/Equation-Geographique.app/Contents/MacOS/Equation-Geographique --help
          else
            dist/Equation-Geographique/Equation-Geographique --help
          fi

      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Equation-Geographique -DestinationPath dist\Equation-Geographique-Windows-Portable.zip
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item dist\Equation-Geographique-Windows-Installateur.exe, dist\Equation-Geographique-Windows-Portable.zip out\

      - name: Empaqueter (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg out
          cp -R dist/Equation-Geographique.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Équation géographique" -srcfolder dmg -ov -format UDZO out/Equation-Geographique-macOS.dmg

      - name: Empaqueter (Linux)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-deb.sh "$VERSION"
          tar -czf dist/Equation-Geographique-Linux.tar.gz -C dist Equation-Geographique
          mkdir -p out
          mv dist/Equation-Geographique-Linux.deb dist/Equation-Geographique-Linux.tar.gz out/

      - uses: actions/upload-artifact@v4
        with:
          name: Equation-Geographique-${{ matrix.name }}
          path: out/*

  publish:
    name: Joindre à la release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Téléverser les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber --repo "${{ github.repository }}"
