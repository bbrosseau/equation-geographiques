name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Mireille-Tuto-Windows.zip
            asset_name: Mireille-Tuto-Windows.zip
          - os: macos-latest
            artifact_name: Mireille-Tuto-macOS.zip
            asset_name: Mireille-Tuto-macOS.zip
          - os: ubuntu-latest
            artifact_name: Mireille-Tuto-Linux.tar.gz
            asset_name: Mireille-Tuto-Linux.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Linux GUI libraries (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies & PyInstaller
        run: |
          uv venv
          uv pip install . "pyinstaller>=6.11.0" pillow

      - name: Generate Windows icon (.ico)
        run: |
          uv run python -c "from PIL import Image; img = Image.open('src/mireille_tuto/data/icon.png'); img.save('src/mireille_tuto/data/icon.ico', sizes=[(16,16), (24,24), (32,32), (48,48), (64,64), (128,128), (256,256)])"

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller --clean --noconfirm mireille_tuto.spec

      # Empaquetage Windows
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Mireille-Tuto.exe -DestinationPath dist/${{ matrix.artifact_name }}

      # Empaquetage macOS
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ${{ matrix.artifact_name }} Mireille-Tuto.app

      # Empaquetage Linux (utilisable aussi sur ChromeOS avec environnement Linux)
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ${{ matrix.artifact_name }} Mireille-Tuto

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
          generate_release_notes: true
          draft: false
          prerelease: false
